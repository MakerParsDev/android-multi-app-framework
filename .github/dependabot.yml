version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 3
    groups:
      actions-patch-minor:
        patterns:
          - '*'
        update-types:
          - patch
          - minor

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 3
    groups:
      gradle-dev-patch-minor:
        dependency-type: development
        patterns:
          - '*'
        update-types:
          - patch
          - minor
        exclude-patterns:
          # Toolchain, auth/crypto, build-runtime and root forced dependencies
          # must remain isolated because Mergify treats them as manual/protected.
          - 'com.android.*'
          - 'org.jetbrains.kotlin.*'
          - 'com.google.devtools.ksp'
          - 'com.google.dagger.*'
          - 'androidx.room.*'
          - 'androidx.credentials.*'
          - 'com.google.gms.*'
          - 'com.google.firebase.*'
          - 'com.google.crypto.tink.*'
          - 'com.github.triplet.play'
          - 'com.android.billingclient.*'
          - 'io.netty:*'
          - 'org.bouncycastle:*'
          - 'com.google.guava:guava'
          - 'org.jdom:jdom2'
          - 'org.bitbucket.b_c:jose4j'
          - 'org.apache.commons:commons-lang3'
          - 'ch.qos.logback:*'
          - 'org.apache.httpcomponents:httpclient'
          - 'com.squareup.wire:*'
          - 'gradle-wrapper'
      gradle-prod-patch:
        dependency-type: production
        patterns:
          - '*'
        update-types:
          - patch
        exclude-patterns:
          - 'com.android.*'
          - 'org.jetbrains.kotlin.*'
          - 'com.google.devtools.ksp'
          - 'com.google.dagger.*'
          - 'androidx.room.*'
          - 'androidx.credentials.*'
          - 'com.google.gms.*'
          - 'com.google.firebase.*'
          - 'com.google.crypto.tink.*'
          - 'com.github.triplet.play'
          - 'com.android.billingclient.*'
          - 'io.netty:*'
          - 'org.bouncycastle:*'
          - 'com.google.guava:guava'
          - 'org.jdom:jdom2'
          - 'org.bitbucket.b_c:jose4j'
          - 'org.apache.commons:commons-lang3'
          - 'ch.qos.logback:*'
          - 'org.apache.httpcomponents:httpclient'
          - 'com.squareup.wire:*'
          - 'gradle-wrapper'

  - package-ecosystem: pip
    directory: /scripts/ci
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 3
    groups:
      pip-patch-minor:
        patterns:
          - '*'
        update-types:
          - patch
          - minor

