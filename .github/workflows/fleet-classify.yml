name: Jules Fleet PR Classifier

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: fleet-classify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify PR Risk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      vars.AUTONOMOUS_MAINTENANCE_ENABLED == 'true' &&
      vars.JULES_FLEET_ENABLED == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'jules/')
    permissions:
      contents: read
      issues: write
      pull-requests: read

    steps:
      - name: Checkout Repository (Trusted Base)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref }}
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Evaluate Risk and Synchronize Labels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/ci/classify_pr.py
