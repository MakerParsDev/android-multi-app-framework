name: CodSpeed Benchmarks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

concurrency:
  group: codspeed-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: '-Djava.awt.headless=true -Dorg.gradle.daemon=false'
  JAVA_VERSION: '21'

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # required for actions/checkout
      id-token: write # required for OIDC authentication with CodSpeed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Diagnostics only: hosted Walltime runners may have different CPUs and images.
      # Print nonsecret hardware/runtime metadata before interpreting CodSpeed deltas.
      - name: Report benchmark runner environment
        shell: bash
        run: |
          set -euo pipefail
          printf 'runner_os=%s\n' "${RUNNER_OS:-unknown}"
          printf 'runner_arch=%s\n' "${RUNNER_ARCH:-unknown}"
          printf 'runner_image_os=%s\n' "${ImageOS:-unknown}"
          printf 'runner_image_version=%s\n' "${ImageVersion:-unknown}"
          printf 'kernel_arch=%s\n' "$(uname -m)"
          cpu_model="$(awk -F: '/^model name[[:space:]]*:/ { sub(/^[[:space:]]+/, "", $2); print $2; exit }' /proc/cpuinfo)"
          printf 'cpu_model=%s\n' "${cpu_model:-unknown}"
          printf 'available_processors=%s\n' "$(nproc)"
          java -version

      - name: Build benchmarks
        run: ./gradlew -p benchmarks jmhJar --no-daemon

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da # v5.5.0
        with:
          mode: walltime
          run: ./gradlew -p benchmarks jmh --no-daemon
