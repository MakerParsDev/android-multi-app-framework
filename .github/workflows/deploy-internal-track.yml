name: Deploy Play Store Internal Track

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Flavor to deploy to internal track'
        required: true
        default: 'namazvakitleri'

concurrency:
  group: deploy-internal-track-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Play Console
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate CI Google Services
        run: python scripts/ci/generate_ci_google_services.py --flavors ${{ github.event.inputs.flavor }}

      - name: Build & Publish App Bundle
        run: ./gradlew publish${{ github.event.inputs.flavor }}ReleaseBundle -PPLAY_TRACK=internal
