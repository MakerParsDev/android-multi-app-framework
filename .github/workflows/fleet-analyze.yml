name: Jules Fleet Analyze

on:
  schedule:
    - cron: '0 */6 * * *'  # Run every 6 hours
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-analyze-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Fleet Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.JULES_FLEET_ENABLED == 'true'
    permissions:
      contents: read
      issues: write
      pull-requests: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Resolve JULES_API_KEY from Doppler
        id: resolve-key
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          bash scripts/ci/resolve_jules_api_key.sh

      - name: Ensure Fleet Milestone and Labels
        id: fleet-resources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/ci/fleet_milestone.py --ensure --ensure-labels

      - name: Execute Fleet Analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLEET_MILESTONE: ${{ steps.fleet-resources.outputs.number }}
        run: |
          npx --yes --package=@google/jules-fleet@0.0.1-experimental.35 jules-fleet analyze --goals-dir=".fleet/goals" --milestone "$FLEET_MILESTONE"
