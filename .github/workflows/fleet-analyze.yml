name: Jules Fleet Analyze

on:
  schedule:
    - cron: '0 */6 * * *'  # Run every 6 hours
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-analyze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Fleet Analyze
    runs-on: ubuntu-latest
    if: ${{ vars.JULES_FLEET_ENABLED != 'false' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Resolve JULES_API_KEY from Doppler
        id: resolve-key
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          bash scripts/ci/resolve_jules_api_key.sh

      - name: Ensure Maintenance Milestone Exists
        id: milestone
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MILESTONE_TITLE="Jules Fleet Maintenance"
          npx --yes @google/jules-fleet@0.0.1-experimental.35 configure milestones --title "$MILESTONE_TITLE" --auth token || true

      - name: Execute Fleet Analyze
        env:
          JULES_API_KEY: ${{ env.JULES_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --yes @google/jules-fleet@0.0.1-experimental.35 analyze --goals-dir=".fleet/goals"
