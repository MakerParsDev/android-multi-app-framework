name: Play Internal Release

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: Android application flavor
        required: true
        type: string
        default: kuran_kerim
      retention_days:
        description: Artifact retention
        required: true
        type: choice
        default: '14'
        options: ['7', '14', '30']

permissions:
  contents: read

concurrency:
  group: play-internal-${{ inputs.flavor }}
  cancel-in-progress: false

jobs:
  publish-internal:
    name: Publish Internal ${{ inputs.flavor }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: play-internal
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      REQUESTED_FLAVOR: ${{ inputs.flavor }}
      REQUESTED_RETENTION_DAYS: ${{ inputs.retention_days }}
      DOPPLER_PROJECT: android-multi-app-framework
      DOPPLER_CONFIG: prod
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          check-latest: false

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: side-projects/cloudflare/workers/content-api/package-lock.json

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Set up pinned Android SDK
        run: |
          set -euo pipefail
          bash scripts/ci/setup-android-sdk.sh

      - name: Install pinned Play publisher dependencies
        run: |
          set -euo pipefail
          python3 -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --requirement scripts/ci/requirements-play-publisher.lock

      - name: Validate release inputs
        id: release-inputs
        run: |
          set -euo pipefail
          python3 scripts/ci/validate_release_workflow_input.py \
            --flavor "$REQUESTED_FLAVOR" \
            --retention-days "$REQUESTED_RETENTION_DAYS" >> "$GITHUB_OUTPUT"

      - name: Validate Doppler bootstrap
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${DOPPLER_TOKEN:-}" ]] || {
            echo '::error::DOPPLER_TOKEN is missing for internal release'
            exit 1
          }

      - name: Install verified Doppler CLI
        run: |
          set -euo pipefail
          assignments="$(bash scripts/ci/install_doppler_cli.sh "$RUNNER_TEMP/doppler-bin")"
          eval "$assignments"
          printf '%s\n' "$(dirname "$DOPPLER_BIN")" >> "$GITHUB_PATH"

      - name: Build one signed AAB with next Play version code
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          RELEASE_FLAVOR: ${{ steps.release-inputs.outputs.flavor }}
          RELEASE_CAPITALIZED: ${{ steps.release-inputs.outputs.capitalized }}
        run: |
          set -euo pipefail
          scripts/doppler-run.sh -- bash scripts/ci/build_play_internal_release.sh

      - name: Prepare exact AAB and checksum
        id: artifact
        env:
          RELEASE_FLAVOR: ${{ steps.release-inputs.outputs.flavor }}
        run: |
          set -euo pipefail
          source_dir="app/build/outputs/bundle/${RELEASE_FLAVOR}Release"
          mapfile -t aabs < <(find "$source_dir" -maxdepth 1 -type f -name '*.aab' -print)
          [[ ${#aabs[@]} -eq 1 ]] || {
            echo "::error::Expected exactly one AAB in $source_dir, found ${#aabs[@]}"
            exit 1
          }
          mkdir -p dist
          short_sha="${GITHUB_SHA:0:12}"
          artifact="dist/${RELEASE_FLAVOR}-${short_sha}.aab"
          cp -- "${aabs[0]}" "$artifact"
          artifact_name="$(basename "$artifact")"
          (cd dist && sha256sum "$artifact_name" > "${artifact_name}.sha256")
          printf 'subject_path=%s\n' "$artifact" >> "$GITHUB_OUTPUT"

      # Fail before any Play API write if KSP silently omitted Quran Hilt keys.
      - name: Verify release Hilt ViewModel bindings
        env:
          RELEASE_FLAVOR: ${{ steps.release-inputs.outputs.flavor }}
          AAB_PATH: ${{ steps.artifact.outputs.subject_path }}
        run: |
          set -euo pipefail
          python3 scripts/ci/verify_release_hilt_bindings.py \
            --flavor "$RELEASE_FLAVOR" \
            --aab "$AAB_PATH"

      - name: Attest exact signed AAB
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.artifact.outputs.subject_path }}
          create-storage-record: false

      # The signed bundle must be recoverable before changing Google Play state.
      - name: Archive signed AAB and checksum before Play
        id: signed-evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: play-internal-${{ steps.release-inputs.outputs.flavor }}-${{ github.sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ steps.artifact.outputs.subject_path }}
            ${{ steps.artifact.outputs.subject_path }}.sha256
          if-no-files-found: error
          retention-days: ${{ steps.release-inputs.outputs.retention_days }}

      - name: Publish exact attested AAB to Play internal
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          PACKAGE_NAME: ${{ steps.release-inputs.outputs.package_name }}
          AAB_PATH: ${{ steps.artifact.outputs.subject_path }}
          RELEASE_NAME: internal-${{ github.sha }}
          SIGNED_ARCHIVE_URL: ${{ steps.signed-evidence.outputs.artifact-url }}
        run: |
          set -euo pipefail
          scripts/doppler-run.sh -- python3 scripts/ci/publish_play_internal.py \
            --package-name "$PACKAGE_NAME" \
            --aab "$AAB_PATH" \
            --track internal \
            --release-name "$RELEASE_NAME" \
            --report dist/play-internal-publication.json
          # Publishing finished: record the report without a second archive write.
          python3 - <<'PY_SUMMARY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path("dist/play-internal-publication.json").read_text(encoding="utf-8")
          )
          details = [
              "### Google Play INTERNAL publication",
              "",
              f"- Package: {report['packageName']}",
              f"- Version code: {report['versionCode']}",
              f"- Track: {report['track']}",
              f"- Release: {report['releaseName']}",
              f"- Signed AAB SHA-256: {report['sha256']}",
              f"- Pre-publish evidence: {os.environ['SIGNED_ARCHIVE_URL']}",
              "",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("\n".join(details))
          PY_SUMMARY
