name: Side-project Quality

on:
  workflow_dispatch:

concurrency:
  group: side-projects
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Firebase & Cloudflare Quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Run side-project quality checks
        run: bash scripts/ci/run_side_project_quality.sh --install

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: side-project-quality-report
          path: build/reports/side-projects/
          retention-days: 14
