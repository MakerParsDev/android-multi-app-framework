name: Jules Fleet Dispatch

on:
  schedule:
    - cron: '30 */2 * * *'  # Run every 2 hours
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: fleet-dispatch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dispatch:
    name: Fleet Dispatch Workers
    runs-on: ubuntu-latest
    if: ${{ vars.JULES_FLEET_ENABLED == 'true' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Resolve JULES_API_KEY from Doppler
        id: resolve-key
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          bash scripts/ci/resolve_jules_api_key.sh

      - name: Execute Fleet Dispatch
        if: ${{ env.JULES_API_KEY != '' }}
        env:
          JULES_API_KEY: ${{ env.JULES_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx --yes @google/jules-fleet@0.0.1-experimental.35 dispatch
