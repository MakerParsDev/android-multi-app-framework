name: Auto-Merge Control

on:
  schedule:
    - cron: '0 * * * *'  # Run hourly
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/automerge-control.yml'

permissions:
  contents: read

concurrency:
  group: automerge-control
  cancel-in-progress: true

jobs:
  sync-automerge-label:
    name: Sync Auto-Merge Authorization Label
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Repository (Trusted Base)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Sync automerge:enabled label
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTONOMOUS_MERGE_ENABLED: ${{ vars.AUTONOMOUS_MERGE_ENABLED }}
        run: |
          python3 scripts/ci/sync_automerge_label.py