name: Jules Fleet Merge

on:
  schedule:
    - cron: '0 */4 * * *'  # Run every 4 hours
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-merge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merge:
    name: Execute Fleet Merges
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.AUTONOMOUS_MAINTENANCE_ENABLED == 'true' &&
      vars.JULES_FLEET_ENABLED == 'true'
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Resolve JULES_API_KEY from Doppler
        id: resolve-key
        if: ${{ vars.JULES_FLEET_AUTO_MERGE_ENABLED == 'true' }}
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          bash scripts/ci/resolve_jules_api_key.sh

      - name: Execute Fleet Merge Sequence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTO_MERGE_ENABLED: ${{ vars.JULES_FLEET_AUTO_MERGE_ENABLED }}
        run: |
          if [ "$AUTO_MERGE_ENABLED" = "true" ]; then
            echo "Auto-merge enabled. Executing fleet merge..."
            npx --yes --package=@google/jules-fleet@0.0.1-experimental.35 jules-fleet merge --mode="label" --redispatch
          else
            echo "Auto-merge is disabled (vars.JULES_FLEET_AUTO_MERGE_ENABLED != 'true'). Running safe dry-run."
            npx --yes --package=@google/jules-fleet@0.0.1-experimental.35 jules-fleet merge --mode="label" --dry-run
          fi
