name: Jules Fleet Merge

on:
  schedule:
    - cron: '0 */4 * * *'  # Run every 4 hours
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-merge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merge:
    name: Fleet Merge Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.AUTONOMOUS_MAINTENANCE_ENABLED == 'true' &&
      vars.JULES_FLEET_ENABLED == 'true'
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Enforce Mergify as Sole Merge Authority
        env:
          JULES_FLEET_AUTO_MERGE_ENABLED: ${{ vars.JULES_FLEET_AUTO_MERGE_ENABLED }}
        run: |
          if [ "$JULES_FLEET_AUTO_MERGE_ENABLED" = "true" ]; then
            echo "::error::JULES_FLEET_AUTO_MERGE_ENABLED must remain false. Mergify is the sole automated merge authority."
            exit 1
          fi

      - name: Audit Fleet PRs Ready for Mergify
        id: preview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/ci/fleet_merge_preview.py
