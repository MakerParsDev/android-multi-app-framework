version: 1
canonical_owner: platform-engineering/autonomy

philosophies:
  - MAXIMUM_SAFE_AUTONOMY
  - MINIMUM_HUMAN_MAINTENANCE
  - MINIMUM_DUPLICATED_POLICY
  - FAIL_CLOSED
  - SELF_HEAL_WHERE_POSSIBLE

merge_authority:
  engine: mergify
  direct_merge_to_main_allowed: false
  native_automerge_allowed: false
  fleet_automerge_allowed: false

protected_dependencies:
  gradle_patterns:
    - "com.android.*"
    - "org.jetbrains.kotlin.*"
    - "com.google.devtools.ksp"
    - "com.google.dagger.*"
    - "androidx.room.*"
    - "androidx.credentials.*"
    - "com.google.gms.*"
    - "com.google.firebase.*"
    - "com.google.crypto.tink.*"
    - "com.github.triplet.play"
    - "com.android.billingclient.*"
    - "io.netty:*"
    - "org.bouncycastle:*"
    - "com.google.guava:guava"
    - "org.jdom:jdom2"
    - "org.bitbucket.b_c:jose4j"
    - "org.apache.commons:commons-lang3"
    - "ch.qos.logback:*"
    - "org.apache.httpcomponents:httpclient"
    - "com.squareup.wire:*"
    - "gradle-wrapper"

  npm_patterns:
    - "wrangler"
    - "@cloudflare/*"
    - "firebase-admin"
    - "firebase-functions"
    - "firebase-tools"
    - "jose"
    - "jsonwebtoken"

compatibility_families:
  android_toolchain:
    members:
      - agp
      - kotlin
      - ksp
      - compose
      - codeql
    canary_required: true

  firebase_runtime:
    members:
      - firebase-tools
      - firebase-admin
      - firebase-functions
      - stream-json
      - ts-deepmerge
    canary_required: true

  cloudflare_workers:
    members:
      - wrangler
      - "@cloudflare/workers-types"

active_canaries_and_exceptions: []

dependabot_grouping:
  actions:
    group_name: actions-patch-minor
    update_types: [patch, minor]
  gradle:
    dev_group: gradle-dev-patch-minor
    prod_group: gradle-prod-patch
  npm:
    directories:
      - /side-projects/admin-notifications
      - /side-projects/cloudflare/workers/admin-api
      - /side-projects/cloudflare/workers/content-api
      - /side-projects/cloudflare/workers/ssv-callback
      - /side-projects/firebase/functions
      - /side-projects/firebase/rules-tests
    dev_group: npm-dev-patch-minor
    prod_group: npm-prod-patch

jules_fleet_dispatch:
  max_active_sessions_per_key: 1
  max_active_sessions_per_repo: 3
  max_rolling_sessions_24h: 20
  session_ttl_minutes: 60
  global_kill_switch: false
  repo_kill_switch: false
  scheduler_kill_switch: false
  auto_merge_enabled: false

post_merge_recovery:
  mode: OBSERVE
  direct_revert_main_allowed: false
  bypass_mergify_allowed: false
  auto_create_draft_revert: true
