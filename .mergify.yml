# Mergify configuration for MakerParsDev/android-multi-app-framework
# Mergify is the sole authoritative merge engine for this repository.
# Manual/high-risk, major dependencies, and protected paths are never auto-merged.
# Positive authorization: PRs MUST have label 'automerge:enabled' to be eligible for auto-merge.

queue_rules:
  - name: default
    merge_method: squash
    batch_size: 1
    queue_conditions:
      - base = main
      - -draft
      - -closed
      - -label = do-not-merge
      - -label = hold
      - -label = automerge:disabled
    merge_conditions:
      - check-success = CI Required
      - check-success = Security Required
      - check-success = Secret Scan
      - check-success = Workflow Audit
      - check-success = Dependency Review
      - check-success = SonarCloud Code Analysis
      - check-success = Analyze Java and Kotlin

merge_protections:
  - name: main-branch-protection
    if:
      - base = main
    success_conditions:
      - check-success = CI Required
      - check-success = Security Required
      - check-success = Secret Scan
      - check-success = Workflow Audit
      - check-success = Dependency Review
      - check-success = SonarCloud Code Analysis
      - check-success = Analyze Java and Kotlin
      - -draft
      - -closed
      - -label = do-not-merge
      - -label = hold

merge_protections_settings:
  auto_merge_conditions:
    - or:
        # Class A: Dependabot patch/minor updates (excluding sensitive toolchain)
        # Positive authorization: requires global automerge:enabled label
        # Sensitive denylist applies to ALL dependency types (dev and production)
        # Protected files (control plane) are NEVER auto-merged
        - and:
            - author = dependabot[bot]
            - dependabot-update-type != version-update:semver-major
            - label = automerge:enabled
            - -dependabot-dependency-name ~= ^(com\.android|org\.jetbrains\.kotlin|com\.google\.devtools\.ksp|com\.google\.dagger|androidx\.room|androidx\.credentials|com\.google\.gms|com\.google\.firebase|com\.google\.crypto\.tink|com\.github\.triplet\.play|com\.android\.billingclient|org\.bouncycastle|org\.bitbucket\.b_c|firebase-admin$|firebase-functions$|firebase-functions-test$|firebase-tools$|jose$|jsonwebtoken$|wrangler$|@cloudflare/)
            - -files ~= ^(\.github/|config/|\.gitleaks\.toml|build\.gradle\.kts|settings\.gradle\.kts|gradle\.properties|gradlew$|gradlew\.bat$|gradle/wrapper/|buildSrc/|docs/AUTONOMOUS_MAINTENANCE\.md|\.mergify\.yml|codecov\.yml|\.fleet/|\.agents/|\.claude/|\.codex/|scripts/ci/)
            - or:
                # Dev-only groups may contain patch/minor updates, but no
                # production dependency may piggy-back on the list match.
                - and:
                    - dependabot-dependency-type = development
                    - dependabot-dependency-type != production
                # Production groups are eligible only when every update is a
                # patch and no development dependency is mixed into the group.
                - and:
                    - dependabot-dependency-type = production
                    - dependabot-dependency-type != development
                    - dependabot-update-type = version-update:semver-patch
                    - dependabot-update-type != version-update:semver-minor
            - -label = automerge:disabled
        # Class A: Jules Fleet low-risk PRs
        # Positive authorization: requires global automerge:enabled label
        # Protected files (control plane) are NEVER auto-merged
        - and:
            - head ~= -[0-9]{10,}$
            - -from-fork
            - label = fleet-merge-ready
            - label = risk:low
            - -label = fleet-review-required
            - label = automerge:enabled
            - -label = automerge:disabled
            - -files ~= ^(\.github/|config/|\.gitleaks\.toml|build\.gradle\.kts|settings\.gradle\.kts|gradle\.properties|gradlew$|gradlew\.bat$|gradle/wrapper/|buildSrc/|docs/AUTONOMOUS_MAINTENANCE\.md|\.mergify\.yml|codecov\.yml|\.fleet/|\.agents/|\.claude/|\.codex/|scripts/ci/)
